<!-- Página mostrada pelo GitHub Pages quando o endereço não existe -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endereço não encontrado — The Shooting Pool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
  :root{
    --bg:#0f1210; --panel:#161b16; --line:#2b332a;
    --txt:#e9ece6; --muted:#9aa596; --accent:#e4572e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;
    background:radial-gradient(900px 500px at 50% -10%, #1c2a20 0%, var(--bg) 62%);
    color:var(--txt);display:flex;align-items:center;justify-content:center;padding:20px}
  .caixa{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:32px 26px;max-width:390px;width:100%;text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .marca{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;display:flex;
    align-items:center;justify-content:center;font-size:33px;
    background:linear-gradient(160deg,var(--accent),#a83b1c);
    box-shadow:0 8px 22px rgba(228,87,46,.4)}
  h1{margin:0;font-size:21px;font-weight:800}
  h1 span{color:var(--accent)}
  p{color:var(--muted);font-size:13.5px;line-height:1.65;margin:12px 0 22px}
  a.btn{display:block;background:var(--accent);color:#fff;text-decoration:none;
    padding:13px 18px;border-radius:9px;font-weight:700;font-size:14px}
  a.btn:hover{filter:brightness(1.08)}
</style>

<div class="caixa">
  <div class="marca">🎯</div>
  <h1>The Shooting <span>Pool</span></h1>
  <p>Esse endereço não existe. Deve ser um link antigo ou um erro de digitação —
    o painel de apostas do clube fica na página inicial.</p>
  <a class="btn" href="/theshootingpool/">Ir para o painel</a>
</div>
